# version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-db
    environment:
      - POSTGRES_USER=urlshortener
      - POSTGRES_PASSWORD=urlshortener
      - POSTGRES_DB=urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener-network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://urlshortener:urlshortener@postgres:5432/urlshortener?schema=public
    command: sh -c "npx prisma generate && npx prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - url-shortener-network
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000-3005:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://urlshortener:urlshortener@postgres:5432/urlshortener?schema=public
      - DATACENTER_ID=0
    command: sh scripts/start-with-worker-id.sh dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - url-shortener-network

  nginx:
    image: nginx:alpine
    container_name: url-shortener-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - url-shortener-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  url-shortener-network:
    driver: bridge
