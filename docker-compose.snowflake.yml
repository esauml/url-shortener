version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-db
    environment:
      - POSTGRES_USER=urlshortener
      - POSTGRES_PASSWORD=urlshortener
      - POSTGRES_DB=urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener-network
    restart: unless-stopped

  # App instances with unique Snowflake worker IDs
  app-worker-0:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: url-shortener-app-0
    hostname: app-worker-0
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - WORKER_ID=0
      - DATACENTER_ID=0
      - DATABASE_URL=postgresql://urlshortener:urlshortener@postgres:5432/urlshortener?schema=public
    command: sh -c "npx prisma migrate deploy && npm run dev"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - url-shortener-network

  app-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: url-shortener-app-1
    hostname: app-worker-1
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - WORKER_ID=1
      - DATACENTER_ID=0
      - DATABASE_URL=postgresql://urlshortener:urlshortener@postgres:5432/urlshortener?schema=public
    command: sh -c "npm run dev"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - url-shortener-network

  app-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: url-shortener-app-2
    hostname: app-worker-2
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3002
      - WORKER_ID=2
      - DATACENTER_ID=0
      - DATABASE_URL=postgresql://urlshortener:urlshortener@postgres:5432/urlshortener?schema=public
    command: sh -c "npm run dev"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - url-shortener-network

  nginx:
    image: nginx:alpine
    container_name: url-shortener-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.snowflake.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-worker-0
      - app-worker-1
      - app-worker-2
    networks:
      - url-shortener-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  url-shortener-network:
    driver: bridge
